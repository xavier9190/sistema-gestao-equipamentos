services:
  postgres:
    image: postgres:16-alpine
    container_name: sge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sge
      POSTGRES_PASSWORD: sge_dev_password
      POSTGRES_DB: sge_db
    ports:
      - "5432:5432"
    volumes:
      - sge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sge -d sge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sge_pgdata:
